

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chicago Bike Map Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  
  <!-- LocateControl CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
  
  <!-- custom styling CSS-->
  <link rel="stylesheet" href="css/styles.css" />

</head>
<body>
  <div id="map"></div>
  
  
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- styling JS -->
  <script src="js/style-rules.js"></script>
  
  <!-- Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  
  <!-- Load Leaflet LocateControl plugin -->
  <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>

  <!-- Initiate map -->
  <script src="js/init-map.js"></script>

  <!-- Add map control buttons -->
  <script src="js/map-controls.js"></script>

  <!-- Custom script to initialize LocateControl on the map -->
  <script src="js/locate-control.js"></script>

  
  <script>
   
    //bike lane map layer
  fetch('data/chicagoland_bikeways_19apr25.geojson')
    .then(response => response.json())
    .then(data => {
      L.geoJSON(data, {
        style: getStyle                   //calls function from style-rules.js
      }).addTo(map);
    })
    .catch(err => console.error('Error loading GeoJSON:', err));

 //direction arrow layer
 fetch('data/direction_arrows.json')
  .then(response => response.json())
  .then(data => {
    L.geoJSON(data, {
      pointToLayer: function (feature, latlng) {
        return L.marker(latlng, { icon: getArrowIcon(feature) });
      }
    }).addTo(map);
  })
  .catch(err => console.error('Error loading direction arrows:', err));

    // Trigger location request when searching
    geocoder.on('markgeocode', function (e) {
      // Start location when user tries to search
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (position) {
          locateControl.start(); // Start the locate control once search is done
        }, function (err) {
          console.error("Geolocation error: " + err.message);
        });
      }
    });

    // Optional: Prevent re-prompting if already granted
    if (localStorage.getItem('location-granted') !== 'true') {
      locateControl.start(); // Request location the first time
      localStorage.setItem('location-granted', 'true'); // Remember the choice
    }

  </script>

<div id="legend-popup" style="display: none;">
  <h3>Map Legend</h3>
  <div><span class="legend-line blue"></span> Protected Bike Lane</div>
  <div><span class="legend-line green"></span> Neighborhood Greenway</div>
  <!-- Add more lines or icons as needed -->
</div>
  
</body>
</html>
