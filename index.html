<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chicago Bike Map Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5RD5SLS3X6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-5RD5SLS3X6');
</script>
  
<body>
  <div id="map"></div>

  <!-- Leaflet and plugins -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>

  <!-- Load main module script -->
  <script type="module" src="js/main.js"></script>

  <!-- Legend styling -->
  <div id="legend-popup" style="display: none;">
    <div><strong>Low-Stress Bike Routes</strong></div>
    <div><span class="legend-line" style="background-color: #5A4B49; height: 5px; width: 20px;"></span>Unpaved Trail</div>
    <div><span class="legend-line" style="background-color: navy; height: 5px; width: 20px;"></span>Paved Trail</div>
    <div><span class="legend-line" style="background-color: blue; height: 4px; width: 20px;"></span>Protected Bike Lane</div>
    <br>
    <div><strong>Other Routes</strong></div>
    <div><span class="legend-line" style="background: repeating-linear-gradient(to right, blue, blue 4px, transparent 4px, transparent 8px); height: 4px; width: 20px;"></span>Chill Side Street</div>
    <div><span class="legend-line" style="background: repeating-linear-gradient(to right, orange, orange 4px, transparent 4px, transparent 8px); height: 4px; width: 20px;"></span>Painted Bike Lane, Large</div>
    <div><span class="legend-line" style="background: repeating-linear-gradient(to right, orange, orange 4px, transparent 4px, transparent 8px); height: 1.5px; width: 20px;"></span>Painted Bike Lane, Small</div>
    <br>
    <div><strong>Construction</strong></div>
    <div><span class="legend-line" style="height: 5px; width: 20px; display: inline-block; background-color: transparent; box-shadow: 0 0 6px 3px red;"></span>Under Construction, Blocked Off</div>
    <div><span class="legend-line" style="height: 5px; width: 20px; display: inline-block; background-color: transparent; box-shadow: 0 0 6px 3px limegreen;"></span>Under Construction / New</div>
    <br>
    <a href="about.html">About this map</a>  
  </div>
</body>
</html>
