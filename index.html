<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chicago Bike Map Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <!-- LocateControl CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />

  <style>
    body, html { margin: 0; height: 100%; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <!-- LocateControl JS -->
  <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>

  <script>
    // Initialize map centered on Chicago
    const map = L.map('map').setView([41.8781, -87.6298], 13);

    // Base layer (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
  fetch('data/chicagoland_bikeways.json')
    .then(response => response.json())
    .then(data => {
      L.geoJSON(data, {
        style: {
          color: 'blue',
          weight: 2
        }
      }).addTo(map);
    })
    .catch(err => console.error('Error loading GeoJSON:', err));
    
    // Geocoder (search bar)
    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: true
    }).addTo(map);

    // Locate control (persistent location button)
    const locateControl = L.control.locate({
      position: 'topleft',
      drawCircle: true,
      keepCurrentZoomLevel: true,
      strings: {
        title: "Show me where I am"
      },
      locateOptions: {
        enableHighAccuracy: true
      }
    }).addTo(map);

    // Trigger location request when searching
    geocoder.on('markgeocode', function (e) {
      // Start location when user tries to search
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (position) {
          locateControl.start(); // Start the locate control once search is done
        }, function (err) {
          console.error("Geolocation error: " + err.message);
        });
      }
    });

    // Optional: Prevent re-prompting if already granted
    if (localStorage.getItem('location-granted') !== 'true') {
      locateControl.start(); // Request location the first time
      localStorage.setItem('location-granted', 'true'); // Remember the choice
    }

  </script>
</body>
</html>
