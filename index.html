<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chicago Bike Map Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet & Plugin CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div id="map"></div>

  <!-- Leaflet & Plugins -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>

  <!-- Script Modules -->
  <script type="module">
    import { getStyle } from './js/style-rules.js';
    import { map } from './js/init-map.js';
    import { loadArrowLayer } from './js/map-controls.js';
    import './js/divvyLayer.js';
    import './js/wardLayer.js';

    // Add bikeway GeoJSON
    fetch('data/chicagoland_bikeways_10may25.geojson')
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, { style: getStyle }).addTo(map);
      })
      .catch(err => console.error('Error loading bikeways GeoJSON:', err));

    // Add location direction arrow
    loadArrowLayer(map);
  </script>

  <!-- Legend -->
  <div id="legend-popup" style="display: none;">
    <div><span class="legend-line" style="background-color: blue; height: 5px; width: 20px;"></span>Off-Street Trail, Paved</div>
    <div><span class="legend-line" style="background-color: aqua; height: 5px; width: 20px;"></span>Off-Street Trail, Unpaved</div>
    <div><span class="legend-line" style="background-color: blue; height: 4px; width: 20px;"></span>Protected Bike Lane</div>
    <div><span class="legend-line" style="background: repeating-linear-gradient(to right, blue, blue 4px, transparent 4px, transparent 8px); height: 4px; width: 20px;"></span>Neighborhood Greenway</div>
    <div><span class="legend-line" style="background: repeating-linear-gradient(to right, orange, orange 4px, transparent 4px, transparent 8px); height: 4px; width: 20px;"></span>Large Painted Bike Lane</div>
    <div><span class="legend-line" style="background: repeating-linear-gradient(to right, orange, orange 4px, transparent 4px, transparent 8px); height: 2px; width: 20px;"></span>Low-Quality Painted Bike Lane</div>
  </div>
</body>
</html>
